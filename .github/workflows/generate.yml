name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      # Продолжать выполнение других версий, даже если одна упала (помогает видеть все ошибки сразу)
      fail-fast: false 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # Мы убрали cache: 'pip', так как файла requirements.txt пока нет.
        # Если создадите requirements.txt, верните эту строку:
        # cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Вариант А: Если у вас есть requirements.txt, раскомментируйте строку ниже:
        # pip install -r requirements.txt
        
        # Вариант Б: Установка пакетов напрямую (для вашего скрипта test1.py):
        pip install pandas plotly

    - name: Проверка синтаксиса Python
      run: |
        python -m py_compile test1.py
        echo "✅ Синтаксис test1.py корректен"

    - name: Отладка (показать файлы в репозитории)
      run: |
        echo "Текущая директория: $(pwd)"
        ls -la
