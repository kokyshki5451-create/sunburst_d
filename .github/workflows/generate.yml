name: Generate Sunburst HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "📁 Файлы в репозитории:"
          ls -la
          echo ""
          echo "🔍 Ищем test123.db.sql:"
          find . -name "*.sql" -type f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly openpyxl

      - name: Run script to generate HTML
        run: python test1.py

      - name: Verify index.html was created
        run: |
          if [ ! -f index.html ]; then
            echo "❌ ОШИБКА: index.html не создан!"
            exit 1
          fi
          echo "✅ index.html найден"
          ls -la index.html
          head -c 500 index.html

      - name: Commit and push generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений в index.html"
          else
            git commit -m "chore: auto-generate sunburst index.html"
            git push
            echo "✅ Изменения запушены"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
