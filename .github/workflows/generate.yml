name: Generate Sunburst HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas plotly

      - name: Run script to generate HTML
        run: python test1.py

      - name: Check if index.html was created
        run: |
          if [ ! -f index.html ]; then
            echo "❌ ОШИБКА: Файл index.html не был создан скриптом!"
            exit 1
          fi
          echo "✅ Файл index.html найден."

      - name: Commit and push generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: auto-generate sunburst index.html"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
